# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - k8s-specifications/* # the Update stage pushes here; excluding it prevents an infinite loop
      - azure-pipelines.yml # saving the pipeline file shouldn't start a run

resources:
  - repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: "75d815a9-7c09-49f0-ad2a-961867af1361"
  imageRepository: "yaswanth"
  containerRegistry: "yournameazurecicd.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/result/Dockerfile"
  tag: "$(Build.BuildId)"

pool:
  name: "azureagent" # self-hosted agent pool

stages:
  # ================= VOTE (Python) =================
  - stage: Vote
    displayName: Vote - Build & Push
    jobs:
      - job: BuildPushVote
        steps:
          - task: Docker@2
            displayName: Build & push vote
            inputs:
              command: buildAndPush
              repository: "vote"
              dockerfile: "$(Build.SourcesDirectory)/vote/Dockerfile"
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  # ================= RESULT (Node.js) =================
  - stage: Result
    displayName: Result - Build & Push
    jobs:
      - job: BuildPushResult
        steps:
          - task: Docker@2
            displayName: Build & push result
            inputs:
              command: buildAndPush
              repository: "result"
              dockerfile: "$(Build.SourcesDirectory)/result/Dockerfile"
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  # ================= WORKER (.NET) =================
  - stage: Worker
    displayName: Worker - Build & Push
    jobs:
      - job: BuildPushWorker
        steps:
          - task: Docker@2
            displayName: Build & push worker
            inputs:
              command: buildAndPush
              repository: "worker"
              dockerfile: "$(Build.SourcesDirectory)/worker/Dockerfile"
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  # ================= UPDATE K8s MANIFESTS (CD trigger) =================
  - stage: Update
    displayName: Update K8s Manifests
    dependsOn:
      - Vote
      - Result
      - Worker
    jobs:
      - job: Update
        steps:
          # GIT_PAT is a secret pipeline variable (PAT with Code: Read & write).
          # Set it under Pipelines -> your pipeline -> Edit -> Variables.
          - script: |
              set -e
              rm -rf /tmp/manifests
              git clone "https://$(GIT_PAT)@dev.azure.com/yaswanth0829/yaswanth/_git/yaswanth" /tmp/manifests
              cd /tmp/manifests
              for svc in vote result worker; do
                sed -i "s|image:.*|image: $(containerRegistry)/$svc:$(tag)|" k8s-specifications/$svc-deployment.yaml
              done
              git config user.email "pipeline@azure.com"
              git config user.name "Azure Pipeline"
              git commit -am "Update image tags to $(tag) [skip ci]"
              # If main moved while we were working, rebase on the latest main and retry the push.
              for attempt in 1 2 3 4 5; do
                git pull --rebase origin main && git push origin main && break
                echo "Push attempt $attempt failed, retrying..."
                sleep $((attempt * 3))
              done
              rm -rf /tmp/manifests
            displayName: Update image tags in k8s-specifications
