# Docker CI Pipeline for the Voting App "vote" service
# Build and push the image to Azure Container Registry.
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - main

resources:
  - repo: self

variables:
  # Service connection created automatically during pipeline setup
  dockerRegistryServiceConnection: "a7b60954-5543-48c3-9783-2e811dc7dd23"
  imageRepository: "myfirstdevopsproject"
  containerRegistry: "yournameazurecicd.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/vote/Dockerfile" # point to the vote service
  tag: "$(Build.BuildId)"

pool:
  name: "azureagent" # your self-hosted agent pool

stages:
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: Build
        displayName: Build and Push
        steps:
          - task: Docker@2
            displayName: Build and push an image to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
